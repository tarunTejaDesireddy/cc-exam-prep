<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="RTO vs RPO vs MTD — data loss, recovery time, and the maximum tolerable downtime">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07171c"/>
      <stop offset="55%" stop-color="#0d2b33"/>
      <stop offset="100%" stop-color="#141d39"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12B5A5"/>
      <stop offset="100%" stop-color="#5C7CFA"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="1010" cy="70" r="120" fill="#12B5A5" opacity="0.15" filter="url(#soft)"/>
  <circle cx="860" cy="256" r="100" fill="#5C7CFA" opacity="0.13" filter="url(#soft)"/>
  <rect x="0" y="0" width="6" height="300" rx="3" fill="url(#accent)"/>

  <text x="58" y="82" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="1" fill="#f1f8f8">RTO vs RPO vs MTD</text>
  <text x="58" y="120" font-family="Georgia, Cambria, Times New Roman, serif" font-size="21" font-style="italic" fill="#9dc0bf">Put them on a timeline and they stop being confusing</text>
  <rect x="58" y="142" width="74" height="4" rx="2" fill="url(#accent)"/>
  <text x="58" y="186" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="2.5" fill="#6d9291">ISC2 CC · DOMAIN 2 · SECURITY GOVERNANCE</text>

  <g transform="translate(58,208)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="122" height="32" rx="8" fill="#1d3a2a" stroke="#2F9E44" stroke-width="1.5"/>
    <text x="14" y="21" fill="#cbe9d4">💾 RPO</text>
    <rect x="138" y="0" width="122" height="32" rx="8" fill="#3a2c12" stroke="#F08C00" stroke-width="1.5"/>
    <text x="152" y="21" fill="#f6dfb8">⏱️ RTO</text>
    <rect x="276" y="0" width="122" height="32" rx="8" fill="#3a1a20" stroke="#E03131" stroke-width="1.5"/>
    <text x="290" y="21" fill="#f4c6c9">☠️ MTD</text>
  </g>

  <g transform="translate(930,130)">
    <line x1="0" y1="0" x2="250" y2="0" stroke="#4d6f6e" stroke-width="3"/>
    <circle cx="50" cy="0" r="5" fill="#2F9E44"/>
    <circle cx="100" cy="0" r="6" fill="#3a1a20" stroke="#E03131" stroke-width="2"/>
    <circle cx="170" cy="0" r="5" fill="#F08C00"/>
    <circle cx="240" cy="0" r="5" fill="#E03131"/>
    <text x="100" y="-14" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#f4c6c9">💥 failure</text>
    <text x="170" y="20" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#f6dfb8">RTO</text>
    <text x="240" y="20" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#f4c6c9">MTD</text>
  </g>
</svg>
