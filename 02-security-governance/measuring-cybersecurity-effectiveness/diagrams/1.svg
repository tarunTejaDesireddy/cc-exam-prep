idth="160.453125" height="90"><div style="color: rgb(255, 255, 255) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fff !important" class="nodeLabel"><p>KRI: Key RISK Indicator<br />like a fuel warning light<br />'overdue critical patches<br />climbing every month'</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-W-1" data-look="neo" transform="translate(358.1171875, 69)"><rect class="basic label-container" style="fill:#3a2c12 !important;stroke:#F08C00 !important" x="-94.9140625" y="-45.75" width="189.828125" height="91.5"/><g class="label" style="color:#fff !important" transform="translate(-78.9140625, -33.75)"><rect/><foreignObject width="157.828125" height="67.5"><div style="color: rgb(255, 255, 255) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fff !important" class="nodeLabel"><p>WARNS: risk is building<br />BEFORE anything bad<br />has happened</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-KPI-2" data-look="neo" transform="translate(117.6015625, 223)"><rect class="basic label-container" style="fill:#12243f !important;stroke:#5C7CFA !important" x="-105.6015625" y="-57" width="211.203125" height="114"/><g class="label" style="color:#fff !important" transform="translate(-89.6015625, -45)"><rect/><foreignObject width="179.203125" height="90"><div style="color: rgb(255, 255, 255) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fff !important" class="nodeLabel"><p>KPI: Key PERFORMANCE<br />Indicator, like lap time<br />'95% patched within SLA,<br />target is 98%'</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-