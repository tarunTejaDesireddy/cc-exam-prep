 .katex path{fill:#000;stroke:#000;stroke-width:1px;}#my-svg .rough-node .label,#my-svg .node .label,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-align:center;}#my-svg .node.clickable{cursor:pointer;}#my-svg .root .anchor path{fill:#6b8f8e!important;stroke-width:0;stroke:#6b8f8e;}#my-svg .arrowheadPath{fill:#f2eee8;}#my-svg .edgePaths .path{stroke:#6b8f8e;stroke-width:1px;}#my-svg .flowchart-link{stroke:#6b8f8e;fill:none;}#my-svg .edgeLabel{background-color:#0d1117;text-align:center;}#my-svg .edgeLabel p{background-color:#0d1117;}#my-svg .edgeLabel rect{opacity:0.5;background-color:#0d1117;fill:#0d1117;}#my-svg .labelBkg{background-color:rgba(13, 17, 23, 0.5);}#my-svg .cluster rect{fill:#161b22;stroke:#30363d;stroke-width:1px;}#my-svg .cluster text{fill:#e6edf3;}#my-svg .cluster span{color:#e6edf3;}#my-svg .node .collapsed-indicator{fill:#30363d;stroke:none;opacity:0.6;}#my-svg .node .collapsed-separator{stroke:#30363d;stroke-width:0.75px;}#my-svg div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Arial,Helvetica,sans-serif;font-size:12px;background:hsl(36, 55.5555555556%, 20.8823529412%);border:1px solid hsl(36, 15.5555555556%, 10.8823529412%);border-radius:2px;pointer-events:none;z-index:100;}#my-svg .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#e6edf3;}#my-svg rect.text{fill:none;stroke-width:0;}#my-svg .icon-shape,#my-svg .image-shape{background-color:#0d1117;text-align:center;}#my-svg .icon-shape p,#my-svg .image-shape p{background-color:#0d1117;padding:2px;}#my-svg .icon-shape .label rect,#my-svg .image-shape .label rect{opacity:0.5;background-color:#0d1117;fill:#0d1117;}#my-svg .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#my-svg .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#my-svg .node .neo-node{stroke:#5C7CFA;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node