<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Business Impact Analysis — what would hurt, and how fast must we recover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07171c"/>
      <stop offset="55%" stop-color="#0d2b33"/>
      <stop offset="100%" stop-color="#141d39"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12B5A5"/>
      <stop offset="100%" stop-color="#5C7CFA"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="1010" cy="70" r="120" fill="#12B5A5" opacity="0.15" filter="url(#soft)"/>
  <circle cx="860" cy="256" r="100" fill="#5C7CFA" opacity="0.13" filter="url(#soft)"/>
  <rect x="0" y="0" width="6" height="300" rx="3" fill="url(#accent)"/>

  <text x="58" y="82" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="1" fill="#f1f8f8">Business Impact Analysis</text>
  <text x="58" y="120" font-family="Georgia, Cambria, Times New Roman, serif" font-size="21" font-style="italic" fill="#9dc0bf">What would hurt, and how fast must we recover?</text>
  <rect x="58" y="142" width="74" height="4" rx="2" fill="url(#accent)"/>
  <text x="58" y="186" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="2.5" fill="#6d9291">ISC2 CC · DOMAIN 2 · SECURITY GOVERNANCE</text>

  <g transform="translate(58,208)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="106" height="32" rx="8" fill="#12243f" stroke="#5C7CFA" stroke-width="1.5"/>
    <text x="14" y="21" fill="#cdd9fb">💥 BIA</text>
    <rect x="122" y="0" width="122" height="32" rx="8" fill="#3a2c12" stroke="#F08C00" stroke-width="1.5"/>
    <text x="136" y="21" fill="#f6dfb8">⏱️ RTO</text>
    <rect x="260" y="0" width="122" height="32" rx="8" fill="#1d3a2a" stroke="#2F9E44" stroke-width="1.5"/>
    <text x="274" y="21" fill="#cbe9d4">💾 RPO</text>
  </g>

  <g transform="translate(940,120)">
    <line x1="0" y1="0" x2="220" y2="0" stroke="#4d6f6e" stroke-width="3"/>
    <circle cx="60" cy="0" r="6" fill="#F08C00"/>
    <text x="60" y="-14" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#f6dfb8">RPO</text>
    <circle cx="150" cy="0" r="6" fill="#3a1a20" stroke="#E03131" stroke-width="2"/>
    <text x="150" y="-14" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#f4c6c9">disruption</text>
    <circle cx="210" cy="0" r="6" fill="#2F9E44"/>
    <text x="210" y="20" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#cbe9d4">RTO</text>
  </g>
