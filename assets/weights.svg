    <text x="0" y="34" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6d9291">Domain 5 · 9 topics</text>
    <rect x="270" y="0" width="526" height="34" rx="6" fill="url(#b4)"/>
    <text x="286" y="23" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">18%</text>
    <text x="812" y="23" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#9dc0bf">~18 Q</text>
  </g>

  <!-- Row 5: BC DR IR 10% -> 292 -->
  <g transform="translate(46,344)">
    <text x="0" y="14" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#f1f8f8">🚨 BC, DR &amp; Incident Response</text>
