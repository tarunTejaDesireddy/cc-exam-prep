      <stop offset="0%" stop-color="#07171c"/>
      <stop offset="55%" stop-color="#0d2b33"/>
      <stop offset="100%" stop-color="#141d39"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e8f83"/><stop offset="100%" stop-color="#12B5A5"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12B5A5"/><stop offset="100%" stop-color="#2f9bc4"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3f86d4"/><stop offset="100%" stop-color="#5C7CFA"/>
    </linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a6ae0"/><stop offset="100%" stop-color="#7048E8"/>
