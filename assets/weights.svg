  <rect x="0" y="0" width="6" height="430" rx="3" fill="url(#accent)"/>

  <text x="46" y="52" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="700" fill="#f1f8f8">Where the 100 questions come from</text>
  <text x="46" y="78" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#9dc0bf">Bar length is the share of the paper. Study top to bottom.</text>

  <!-- scale: 26% -> 760px. factor 29.23 per % -->
  <!-- Row 1: Security Principles 26% -->
  <g transform="translate(46,104)">
    <text x="0" y="14" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#f1f8f8">🧭 Security Principles</text>
    <text x="0" y="34" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6d9291">Domain 1 · 11 topics</text>
    <rect x="270" y="0" width="760" height="34" rx="6" fill="url(#b1)"/>
    <text x="286" y="23" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#04201d">26%</text>
    <text x="1046" y="23" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#9dc0bf">~26 Q</text>
  </g>

  <!-- Row 2: Network Security 24% -> 701 -->
  <g transform="translate(46,164)">
    <text x="0" y="14" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#f1f8f8">🌐 Network Security</text>
    <text x="0" y="34" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6d9291">Domain 4 · 11 topics</text>
