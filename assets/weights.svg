<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Exam domain weights: Security Principles 26%, Network Security 24%, Access Control 22%, Security Operations 18%, BC DR and Incident Response 10%">
  <defs>
