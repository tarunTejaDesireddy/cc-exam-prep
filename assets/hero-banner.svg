<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="ISC2 CC exam prep — two silhouetted figures in suits and dark glasses in front of a glowing lab wall">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="45%" stop-color="#141a3a"/>
      <stop offset="100%" stop-color="#1d1140"/>
    </linearGradient>
    <linearGradient id="hacc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12B5A5"/>
      <stop offset="100%" stop-color="#5C7CFA"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3dff9e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1f9d5e" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3560"/>
      <stop offset="100%" stop-color="#151c38"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd6e8"/>
      <stop offset="100%" stop-color="#4a9fc4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3dff9e" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3dff9e" stop-opacity="0"/>
    </radialGradient>
    <filter id="hsoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="lens" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#hbg)"/>

    <!-- arched lab window -->
    <path d="M 640 360 L 640 150 A 210 210 0 0 1 1060 150 L 1060 360 Z" fill="#0f1630" opacity="0.75"/>
    <path d="M 640 360 L 640 150 A 210 210 0 0 1 1060 150 L 1060 360 Z" fill="none" stroke="#3a4580" stroke-width="3" opacity="0.8"/>
    <ellipse cx="850" cy="230" rx="200" ry="130" fill="url(#glow)"/>

    <!-- glowing tubes hanging from the arch -->
    <g opacity="0.92">
      <rect x="700" y="150" width="13" height="96" rx="6.5" fill="url(#tube)"/>
      <rect x="730" y="150" width="13" height="142" rx="6.5" fill="url(#tube)"/>
      <rect x="760" y="150" width="13" height="70" rx="6.5" fill="url(#tube)"/>
      <rect x="790" y="150" width="13" height="120" rx="6.5" fill="url(#tube)"/>
      <rect x="820" y="150" width="13" height="88" rx="6.5" fill="url(#tube)"/>
      <rect x="850" y="150" width="13" height="158" rx="6.5" fill="url(#tube)"/>
      <rect x="880" y="150" width="13" height="76" rx="6.5" fill="url(#tube)"/>
      <rect x="910" y="150" width="13" height="130" rx="6.5" fill="url(#tube)"/>
      <rect x="940" y="150" width="13" height="94" rx="6.5" fill="url(#tube)"/>
      <rect x="970" y="150" width="13" height="112" rx="6.5" fill="url(#tube)"/>
      <rect x="1000" y="150" width="13" height="66" rx="6.5" fill="url(#tube)"/>
    </g>

    <!-- ============ TALL AGENT (right, behind) ============ -->
    <g>
      <!-- torso -->
      <path d="M 992 360 L 992 232 Q 992 206 1018 200 L 1052 192 L 1086 200 Q 1112 206 1112 232 L 1112 360 Z" fill="url(#suit)"/>
      <!-- shirt + lapels -->
      <path d="M 1036 192 L 1052 236 L 1068 192 L 1052 186 Z" fill="#e8f4f8"/>
      <path d="M 1036 192 L 1052 236 L 1030 214 Z" fill="#0d1330"/>
      <path d="M 1068 192 L 1052 236 L 1074 214 Z" fill="#0d1330"/>
      <!-- tie -->
      <path d="M 1052 236 L 1044 250 L 1052 320 L 1060 250 Z" fill="#0a0f22"/>
      <!-- head -->
      <ellipse cx="1052" cy="150" rx="40" ry="46" fill="url(#skin)"/>
      <!-- shades -->
      <rect x="1016" y="136" width="72" height="6" rx="3" fill="#070c18"/>
      <path d="M 1018 140 h 30 a 4 4 0 0 1 4 4 v 12 a 6 6 0 0 1 -6 6 h -22 a 6 6 0 0 1 -6 -6 v -12 a 4 4 0 0 1 0 -4 z" fill="#070c18"/>
      <path d="M 1056 140 h 30 a 4 4 0 0 1 0 4 v 12 a 6 6 0 0 1 -6 6 h -22 a 6 6 0 0 1 -6 -6 v -12 a 4 4 0 0 1 4 -4 z" fill="#070c18"/>
      <path d="M 1022 144 l 16 0 l -12 18 l -4 0 z" fill="#12B5A5" opacity="0.55" filter="url(#lens)"/>
      <path d="M 1060 144 l 16 0 l -12 18 l -4 0 z" fill="#12B5A5" opacity="0.55" filter="url(#lens)"/>
      <!-- raised arm holding a flask -->
      <path d="M 1006 236 Q 984 210 990 180 L 1006 176 Q 1004 208 1024 230 Z" fill="url(#suit)"/>
      <ellipse cx="996" cy="172" rx="13" ry="11" fill="url(#skin)"/>
      <rect x="984" y="126" width="24" height="44" rx="8" fill="#9fe8f5" opacity="0.55"/>
      <rect x="984" y="146" width="24" height="24" rx="6" fill="#3dff9e" opacity="0.75"/>
      <rect x="992" y="116" width="8" height="12" rx="3" fill="#c7f4fb" opacity="0.8"/>
      <ellipse cx="996" cy="114" rx="17" ry="5" fill="#c7f4fb" opacity="0.7"/>
    </g>

    <!-- ============ SHORT AGENT (left, front) ============ -->
    <g>
      <!-- torso -->
      <path d="M 560 360 L 560 300 Q 560 274 588 268 L 626 260 L 664 268 Q 692 274 692 300 L 692 360 Z" fill="url(#suit)"/>
      <path d="M 608 260 L 626 306 L 644 260 L 626 254 Z" fill="#e8f4f8"/>
      <path d="M 608 260 L 626 306 L 602 284 Z" fill="#0d1330"/>
      <path d="M 644 260 L 626 306 L 650 284 Z" fill="#0d1330"/>
      <path d="M 626 306 L 617 320 L 626 360 L 635 320 Z" fill="#0a0f22"/>
      <!-- head -->
      <circle cx="626" cy="216" r="48" fill="url(#skin)"/>
      <!-- shades -->
      <rect x="584" y="204" width="84" height="7" rx="3.5" fill="#070c18"/>
      <path d="M 586 209 h 34 a 5 5 0 0 1 5 5 v 15 a 7 7 0 0 1 -7 7 h -26 a 7 7 0 0 1 -7 -7 v -15 a 5 5 0 0 1 1 -5 z" fill="#070c18"/>
      <path d="M 631 209 h 34 a 5 5 0 0 1 1 5 v 15 a 7 7 0 0 1 -7 7 h -26 a 7 7 0 0 1 -7 -7 v -15 a 5 5 0 0 1 5 -5 z" fill="#070c18"/>
      <path d="M 592 214 l 19 0 l -14 22 l -5 0 z" fill="#5C7CFA" opacity="0.6" filter="url(#lens)"/>
      <path d="M 637 214 l 19 0 l -14 22 l -5 0 z" fill="#5C7CFA" opacity="0.6" filter="url(#lens)"/>
      <!-- briefcase -->
      <rect x="576" y="330" width="100" height="30" rx="5" fill="#1b2347" stroke="#41508c" stroke-width="2"/>
      <rect x="612" y="324" width="28" height="8" rx="4" fill="none" stroke="#41508c" stroke-width="2.5"/>
      <ellipse cx="592" cy="326" rx="11" ry="9" fill="url(#skin)"/>
      <ellipse cx="660" cy="326" rx="11" ry="9" fill="url(#skin)"/>
    </g>

    <!-- left-edge vignette so the text sits clean -->
    <rect x="0" y="0" width="560" height="360" fill="url(#hbg)" opacity="0.55"/>
    <rect x="0" y="0" width="520" height="360" fill="#0a0f1f" opacity="0.55"/>

    <!-- ============ TITLE ============ -->
    <text x="58" y="118" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="3.4" fill="#12B5A5">ISC2 · CERTIFIED IN CYBERSECURITY</text>
    <text x="58" y="176" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="700" fill="#f2f7ff">Pass the CC exam</text>
    <rect x="58" y="196" width="88" height="5" rx="2.5" fill="url(#hacc)"/>
    <text x="58" y="236" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#a9bcd8">Not a security course — a course in how ISC2 words things.</text>
    <text x="58" y="262" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#a9bcd8">53 topics · 738 questions · 3 mock exams.</text>

    <g transform="translate(58,288)">
      <rect x="0" y="0" width="150" height="32" rx="8" fill="#0f2e38" stroke="#12B5A5" stroke-width="1.6"/>
      <text x="14" y="21" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#9fe6dd">100 Q · 2 hours</text>
      <rect x="162" y="0" width="132" height="32" rx="8" fill="#141c3d" stroke="#5C7CFA" stroke-width="1.6"/>
      <text x="176" y="21" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#b9c6f7">Pass 700/1000</text>
      <rect x="306" y="0" width="150" height="32" rx="8" fill="#12301f" stroke="#2F9E44" stroke-width="1.6"/>
      <text x="320" y="21" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#a6e2b6">Thu 5 Nov 2026</text>
    </g>
  </g>

  <rect x="0" y="0" width="6" height="360" rx="3" fill="url(#hacc)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="18" fill="none" stroke="#2a3560" stroke-width="1.5"/>
</svg>
