<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Repo contents: 50 topic pages, 711 practice questions, 152 diagrams, 591 flashcards, 3 mock exams">
