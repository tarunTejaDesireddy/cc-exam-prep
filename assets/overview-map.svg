<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Repo map: Foundations, then five exam domains in weight order, then term bank, question bank and mock exams, then the exam day cram page">
  <defs>
    <linearGradient id="obg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07171c"/>
      <stop offset="55%" stop-color="#0d2b33"/>
      <stop offset="100%" stop-color="#141d39"/>
    </linearGradient>
    <linearGradient id="oacc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12B5A5"/><stop offset="100%" stop-color="#5C7CFA"/>
    </linearGradient>
    <filter id="osoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <marker id="oarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d6f6e"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="18" fill="url(#obg)"/>
  <circle cx="1090" cy="70" r="120" fill="#12B5A5" opacity="0.10" filter="url(#osoft)"/>
  <circle cx="140" cy="470" r="110" fill="#5C7CFA" opacity="0.09" filter="url(#osoft)"/>
  <rect x="0" y="0" width="6" height="520" rx="3" fill="url(#oacc)"/>

  <text x="46" y="50" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="700" fill="#f1f8f8">How the repo fits together</text>
  <text x="46" y="76" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#9dc0bf">Left to right. Domains are ordered by exam weight, not by number.</text>

  <!-- STAGE 1 -->
  <text x="46" y="118" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#6d9291">1 · BEFORE YOU START</text>
  <g>
    <rect x="46" y="130" width="200" height="86" rx="10" fill="#0f3038" stroke="#12B5A5" stroke-width="2"/>
    <text x="62" y="156" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#f1f8f8">🧱 00 · Foundations</text>
    <text x="62" y="178" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9dc0bf">How the exam works, and</text>
    <text x="62" y="194" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9dc0bf">how ISC2 wants you to think</text>
    <text x="62" y="210" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#12B5A5">5 topics · read first</text>
  </g>
  <line x1="252" y1="173" x2="290" y2="173" stroke="#4d6f6e" stroke-width="2" marker-end="url(#oarrow)"/>

  <!-- STAGE 2 : the five domains -->
  <text x="298" y="118" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#6d9291">2 · THE FIVE EXAM DOMAINS · IN WEIGHT ORDER</text>

  <g>
    <rect x="298" y="130" width="146" height="66" rx="10" fill="#12243f" stroke="#12B5A5" stroke-width="2"/>
    <text x="312" y="154" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#f1f8f8">🧭 01 Principles</text>
    <text x="312" y="174" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#12B5A5">24%</text>
    <text x="370" y="174" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6d9291">12 topics</text>
    <text x="312" y="189" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#6d9291">the vocabulary everything else uses</text>
  </g>
  <g>
    <rect x="458" y="130" width="146" height="66" rx="10" fill="#12243f" stroke="#2f9bc4" stroke-width="2"/>
    <text x="472" y="154" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#f1f8f8">🌐 04 Net/Cloud</text>
    <text x="472" y="174" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#2f9bc4">21.3%</text>
    <text x="530" y="174" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6d9291">14 topics</text>
    <text x="472" y="189" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#6d9291">familiar — read it for phrasing</text>
  </g>
  <g>
    <rect x="618" y="130" width="146" height="66" rx="10" fill="#12243f" stroke="#5C7CFA" stroke-width="2"/>
    <text x="632" y="154" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#f1f8f8">🚪 03 IAM</text>
    <text x="632" y="174" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#5C7CFA">20%</text>
    <text x="690" y="174" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6d9291">6 topics</text>
    <text x="632" y="189" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#6d9291">the four models carry it</text>
  </g>
  <g>
    <rect x="778" y="130" width="146" height="66" rx="10" fill="#12243f" stroke="#7048E8" stroke-width="2"/>
    <text x="792" y="154" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#f1f8f8">🚨 02 Governance</text>
    <text x="792" y="174" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#8b6cf0">17.3%</text>
    <text x="850" y="174" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6d9291">7 topics</text>
    <text x="792" y="189" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#6d9291">GRC, BC/DR, awareness</text>
  </g>
  <g>
    <rect x="938" y="130" width="146" height="66" rx="10" fill="#1a1f2e" stroke="#6d7391" stroke-width="2"/>
    <text x="952" y="154" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#f1f8f8">⚙️ 05 Ops/IR</text>
    <text x="952" y="174" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#9aa0bd">17.3%</text>
    <text x="1010" y="174" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6d9291">14 topics</text>
    <text x="952" y="189" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#6d9291">tied for smallest</text>
  </g>

  <!-- chevrons between domains -->
  <path d="M 448 163 L 454 163" stroke="#4d6f6e" stroke-width="2" marker-end="url(#oarrow)"/>
  <path d="M 608 163 L 614 163" stroke="#4d6f6e" stroke-width="2" marker-end="url(#oarrow)"/>
  <path d="M 768 163 L 774 163" stroke="#4d6f6e" stroke-width="2" marker-end="url(#oarrow)"/>
  <path d="M 928 163 L 934 163" stroke="#4d6f6e" stroke-width="2" marker-end="url(#oarrow)"/>

  <!-- 72% bracket under first three -->
  <path d="M 298 208 L 298 218 L 764 218 L 764 208" fill="none" stroke="#12B5A5" stroke-width="1.5" opacity="0.8"/>
  <text x="531" y="236" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#12B5A5">these three are 72% of the paper</text>

  <!-- STAGE 3 : drills -->
  <text x="46" y="286" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#6d9291">3 · THEN DRILL WHAT YOU READ</text>
  <g>
    <rect x="46" y="298" width="290" height="80" rx="10" fill="#0f3038" stroke="#12B5A5" stroke-width="2"/>
    <text x="62" y="324" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#f1f8f8">🗂️ 06 · Term Bank</text>
    <text x="62" y="345" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9dc0bf">651 flashcards · 55 confused pairs</text>
    <text x="62" y="366" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#12B5A5">5 minutes daily, from week 2</text>
  </g>
  <g>
    <rect x="352" y="298" width="290" height="80" rx="10" fill="#12243f" stroke="#5C7CFA" stroke-width="2"/>
    <text x="368" y="324" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#f1f8f8">❓ 07 · Question Bank</text>
    <text x="368" y="345" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9dc0bf">160 questions · domain + mixed drills</text>
    <text x="368" y="366" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5C7CFA">open book · every distractor explained</text>
  </g>
  <g>
    <rect x="658" y="298" width="290" height="80" rx="10" fill="#3a2c12" stroke="#F08C00" stroke-width="2"/>
    <text x="674" y="324" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#f1f8f8">📝 08 · Mock Exams</text>
    <text x="674" y="345" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#e8cfa4">3 × 100 questions · timed</text>
    <text x="674" y="366" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#F08C00">closed book · single use · aim 80%+</text>
  </g>

  <line x1="342" y1="338" x2="346" y2="338" stroke="#4d6f6e" stroke-width="2" marker-end="url(#oarrow)"/>
  <line x1="648" y1="338" x2="652" y2="338" stroke="#4d6f6e" stroke-width="2" marker-end="url(#oarrow)"/>
  <line x1="954" y1="338" x2="978" y2="338" stroke="#4d6f6e" stroke-width="2" marker-end="url(#oarrow)"/>

  <!-- STAGE 4 : exam -->
  <g>
    <rect x="984" y="298" width="170" height="80" rx="10" fill="#1d3a2a" stroke="#2F9E44" stroke-width="2"/>
    <text x="1000" y="324" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#f1f8f8">🎓 EXAM-DAY</text>
    <text x="1000" y="345" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#a8d8b4">one page, read twice</text>
    <text x="1000" y="366" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#2F9E44">3–4 November</text>
  </g>

  <!-- THE LADDER -->
  <rect x="46" y="410" width="1108" height="76" rx="10" fill="#0b2026" stroke="#1d3a42" stroke-width="1.5"/>
  <text x="66" y="437" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#6d9291">THE ANSWER LADDER THAT RUNS THROUGH EVERY TOPIC</text>
  <text x="66" y="468" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#12B5A5">People</text>
  <text x="152" y="468" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" fill="#4d6f6e">·</text>
  <text x="172" y="468" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#4fc3d4">Paper</text>
  <text x="248" y="468" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" fill="#4d6f6e">·</text>
  <text x="268" y="468" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#5C7CFA">Permission</text>
  <text x="410" y="468" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" fill="#4d6f6e">·</text>
  <text x="430" y="468" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#8b6cf0">Ports</text>
  <text x="520" y="462" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#9dc0bf">Protect people · follow the plan · let management decide · then touch the technology.</text>
  <text x="520" y="478" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6d9291">Your working instinct starts at Ports. The exam starts at People.</text>
</svg>
