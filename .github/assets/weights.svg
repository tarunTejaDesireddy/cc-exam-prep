  <!-- 65.3% bracket over rows 1-3 -->
  <g opacity="0.9">
    <path d="M 1052 104 L 1064 104 L 1064 258 L 1052 258" fill="none" stroke="#12B5A5" stroke-width="2"/>
    <text x="1074" y="176" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#12B5A5">65.3%</text>
    <text x="1074" y="193" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6d9291">of the</text>
    <text x="1074" y="207" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6d9291">exam</text>
  </g>
