<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Live exam domain weights: Security Principles 24%, Networking and Cloud Security Concepts 21.3%, IAM Concepts 20%, Security Governance 17.3%, Security Operations and Incident Response 17.3%">
  <defs>
