    <text x="286" y="23" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">17.3%</text>
    <text x="792" y="23" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#9dc0bf">tied</text>
  </g>

  <!-- Row 5: Security Operations and Incident Response 17.3% -> 506px -->
  <g transform="translate(46,344)">
    <text x="0" y="14" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#f1f8f8">⚙️ Security Operations and IR</text>
