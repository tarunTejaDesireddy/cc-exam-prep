  <rect x="0" y="0" width="6" height="430" rx="3" fill="url(#accent)"/>

  <text x="46" y="52" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="700" fill="#f1f8f8">The live outline's five domains</text>
  <text x="46" y="78" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#9dc0bf">Effective 1 September 2026. Bar length is the share of the exam. Study top to bottom.</text>

  <!-- scale: 24% -> 701px. factor 29.23 per % -->
  <!-- Row 1: Security Principles 24% -->
  <g transform="translate(46,104)">
    <text x="0" y="14" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#f1f8f8">🧭 Security Principles</text>
    <text x="0" y="34" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6d9291">Domain 1 · 12 topics</text>
    <rect x="270" y="0" width="701" height="34" rx="6" fill="url(#b1)"/>
    <text x="286" y="23" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#04201d">24%</text>
    <text x="987" y="23" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#9dc0bf">largest</text>
  </g>

