    <text x="0" y="14" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#f1f8f8">🚪 IAM Concepts</text>
    <text x="0" y="34" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6d9291">Domain 3 · 6 topics</text>
