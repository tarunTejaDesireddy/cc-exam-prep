<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Non-Repudiation — you can't deny that you did it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07171c"/>
      <stop offset="55%" stop-color="#0d2b33"/>
      <stop offset="100%" stop-color="#141d39"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12B5A5"/>
      <stop offset="100%" stop-color="#5C7CFA"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c4a52"/>
      <stop offset="100%" stop-color="#232e35"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="1010" cy="70" r="120" fill="#12B5A5" opacity="0.15" filter="url(#soft)"/>
  <circle cx="860" cy="256" r="100" fill="#5C7CFA" opacity="0.13" filter="url(#soft)"/>
  <rect x="0" y="0" width="6" height="300" rx="3" fill="url(#accent)"/>

  <text x="58" y="88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="1" fill="#f1f8f8">Non-Repudiation</text>
  <text x="58" y="128" font-family="Georgia, Cambria, Times New Roman, serif" font-size="22" font-style="italic" fill="#9dc0bf">You can't deny that you did it</text>
  <rect x="58" y="150" width="74" height="4" rx="2" fill="url(#accent)"/>
  <text x="58" y="194" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="2.5" fill="#6d9291">ISC2 CC · DOMAIN 1 · SECURITY PRINCIPLES</text>

  <g transform="translate(58,216)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="0" y="0" width="204" height="34" rx="8" fill="#12243f" stroke="#5C7CFA" stroke-width="1.5"/>
    <text x="18" y="22" fill="#cdd9fb">🔑 Private key signs</text>
    <rect x="222" y="0" width="212" height="34" rx="8" fill="#1d3a2a" stroke="#2F9E44" stroke-width="1.5"/>
    <text x="240" y="22" fill="#cbe9d4">🔓 Public key verifies</text>
  </g>

  <g transform="translate(940,66)">
    <path d="M8 152 Q8 44 96 44 Q184 44 184 152 Z" fill="url(#stone)" stroke="#4d6f6e" stroke-width="2"/>
    <path d="M28 78 L164 78 M28 94 L164 94 M28 110 L120 110" stroke="#0f3038" stroke-width="6" stroke-linecap="round"/>
    <path d="M40 134 q6 -18 16 -8 q6 8 -2 16 q-10 6 -14 -8 Z" fill="#12B5A5"/>
    <circle cx="52" cy="140" r="3" fill="#0d2b33"/>
    <text x="70" y="140" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#9dc0bf">signed 🖐️</text>
  </g>
