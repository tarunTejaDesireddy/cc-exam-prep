<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Risk Treatment — Grog found a risk, now what should he do about it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07171c"/>
      <stop offset="55%" stop-color="#0d2b33"/>
      <stop offset="100%" stop-color="#141d39"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12B5A5"/>
      <stop offset="100%" stop-color="#5C7CFA"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c4a52"/>
      <stop offset="100%" stop-color="#232e35"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="1010" cy="70" r="120" fill="#12B5A5" opacity="0.15" filter="url(#soft)"/>
  <circle cx="860" cy="256" r="100" fill="#5C7CFA" opacity="0.13" filter="url(#soft)"/>
  <rect x="0" y="0" width="6" height="300" rx="3" fill="url(#accent)"/>

  <text x="58" y="82" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="1" fill="#f1f8f8">Risk Treatment</text>
  <text x="58" y="120" font-family="Georgia, Cambria, Times New Roman, serif" font-size="21" font-style="italic" fill="#9dc0bf">Grog found a risk. Now what?</text>
  <rect x="58" y="142" width="74" height="4" rx="2" fill="url(#accent)"/>
  <text x="58" y="186" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="2.5" fill="#6d9291">ISC2 CC · DOMAIN 1 · SECURITY PRINCIPLES</text>

  <g transform="translate(58,208)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="132" height="32" rx="8" fill="#12243f" stroke="#5C7CFA" stroke-width="1.5"/>
    <text x="14" y="21" fill="#cdd9fb">🔧 Mitigate</text>
    <rect x="148" y="0" width="122" height="32" rx="8" fill="#3a2c12" stroke="#F08C00" stroke-width="1.5"/>
    <text x="162" y="21" fill="#f6dfb8">🚫 Avoid</text>
    <rect x="286" y="0" width="132" height="32" rx="8" fill="#1d3a2a" stroke="#2F9E44" stroke-width="1.5"/>
    <text x="300" y="21" fill="#cbe9d4">🤝 Transfer</text>
    <rect x="434" y="0" width="132" height="32" rx="8" fill="#26292e" stroke="#868E96" stroke-width="1.5"/>
    <text x="448" y="21" fill="#dbe7e6">🤷 Accept</text>
  </g>

  <g transform="translate(950,60)">
    <path d="M8 156 Q8 40 96 40 Q184 40 184 156 Z" fill="url(#stone)" stroke="#4d6f6e" stroke-width="2"/>
    <circle cx="96" cy="88" r="20" fill="#0f3038" stroke="#12B5A5" stroke-width="2"/>
    <path d="M84 84 h24 M84 92 h24" stroke="#12B5A5" stroke-width="3" stroke-linecap="round"/>
    <text x="52" y="128" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9dc0bf">👑 owner</text>
    <text x="52" y="146" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9dc0bf">decides</text>
  </g>
</svg>
