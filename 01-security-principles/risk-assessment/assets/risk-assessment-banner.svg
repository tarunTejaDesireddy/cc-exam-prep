<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Risk Assessment — find, analyze, rank, decide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07171c"/>
      <stop offset="55%" stop-color="#0d2b33"/>
      <stop offset="100%" stop-color="#141d39"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12B5A5"/>
      <stop offset="100%" stop-color="#5C7CFA"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c4a52"/>
      <stop offset="100%" stop-color="#232e35"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="1010" cy="70" r="120" fill="#12B5A5" opacity="0.15" filter="url(#soft)"/>
  <circle cx="860" cy="256" r="100" fill="#5C7CFA" opacity="0.13" filter="url(#soft)"/>
  <rect x="0" y="0" width="6" height="300" rx="3" fill="url(#accent)"/>

  <text x="58" y="82" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="1" fill="#f1f8f8">Risk Assessment</text>
  <text x="58" y="120" font-family="Georgia, Cambria, Times New Roman, serif" font-size="21" font-style="italic" fill="#9dc0bf">Find. Analyze. Rank. Decide.</text>
  <rect x="58" y="142" width="74" height="4" rx="2" fill="url(#accent)"/>
  <text x="58" y="186" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="2.5" fill="#6d9291">ISC2 CC · DOMAIN 1 · SECURITY PRINCIPLES</text>

  <g transform="translate(58,208)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="108" height="32" rx="8" fill="#12243f" stroke="#5C7CFA" stroke-width="1.5"/>
    <text x="14" y="21" fill="#cdd9fb">🔍 Find</text>
    <rect x="124" y="0" width="140" height="32" rx="8" fill="#3a2c12" stroke="#F08C00" stroke-width="1.5"/>
    <text x="138" y="21" fill="#f6dfb8">🧮 Analyze</text>
    <rect x="280" y="0" width="126" height="32" rx="8" fill="#1d3a2a" stroke="#2F9E44" stroke-width="1.5"/>
    <text x="294" y="21" fill="#cbe9d4">🚦 Rank</text>
    <rect x="422" y="0" width="140" height="32" rx="8" fill="#0f3038" stroke="#12B5A5" stroke-width="1.5"/>
    <text x="436" y="21" fill="#c8e8e5">🛡️ Decide</text>
  </g>

  <g transform="translate(950,58)">
    <path d="M8 158 Q8 40 96 40 Q184 40 184 158 Z" fill="url(#stone)" stroke="#4d6f6e" stroke-width="2"/>
    <rect x="44" y="72" width="104" height="70" rx="6" fill="#0f3038" stroke="#12B5A5" stroke-width="1.5"/>
    <rect x="56" y="84" width="80" height="8" rx="2" fill="#E03131"/>
    <rect x="56" y="98" width="60" height="8" rx="2" fill="#F08C00"/>
    <rect x="56" y="112" width="40" height="8" rx="2" fill="#2F9E44"/>
    <text x="52" y="154" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9dc0bf">ranked list</text>
  </g>
</svg>
