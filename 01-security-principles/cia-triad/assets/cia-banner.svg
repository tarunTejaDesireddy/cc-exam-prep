<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="The CIA Triad — three rules for keeping the berry map safe">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07171c"/>
      <stop offset="55%" stop-color="#0d2b33"/>
      <stop offset="100%" stop-color="#141d39"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12B5A5"/>
      <stop offset="100%" stop-color="#5C7CFA"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c4a52"/>
      <stop offset="100%" stop-color="#232e35"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="1010" cy="70" r="120" fill="#12B5A5" opacity="0.15" filter="url(#soft)"/>
  <circle cx="860" cy="256" r="100" fill="#5C7CFA" opacity="0.13" filter="url(#soft)"/>
  <rect x="0" y="0" width="6" height="300" rx="3" fill="url(#accent)"/>

  <text x="58" y="88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="1" fill="#f1f8f8">The CIA Triad</text>
  <text x="58" y="128" font-family="Georgia, Cambria, Times New Roman, serif" font-size="22" font-style="italic" fill="#9dc0bf">Three rules for keeping the berry map safe</text>
  <rect x="58" y="150" width="74" height="4" rx="2" fill="url(#accent)"/>
  <text x="58" y="194" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="2.5" fill="#6d9291">ISC2 CC · DOMAIN 1 · SECURITY PRINCIPLES</text>

  <g transform="translate(58,216)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="0" y="0" width="168" height="34" rx="8" fill="#12243f" stroke="#5C7CFA" stroke-width="1.5"/>
    <text x="18" y="22" fill="#cdd9fb">C · Keep it Secret</text>
    <rect x="186" y="0" width="160" height="34" rx="8" fill="#1d3a2a" stroke="#2F9E44" stroke-width="1.5"/>
    <text x="204" y="22" fill="#cbe9d4">I · Keep it True</text>
    <rect x="362" y="0" width="192" height="34" rx="8" fill="#3a2c12" stroke="#F08C00" stroke-width="1.5"/>
    <text x="380" y="22" fill="#f6dfb8">A · Keep it Reachable</text>
  </g>

  <g transform="translate(940,74)">
    <path d="M14 96 Q0 52 34 30 Q66 2 118 12 Q170 20 178 58 Q188 100 150 112 Q80 126 14 96 Z" fill="url(#rock)" stroke="#4d6f6e" stroke-width="2"/>
    <path d="M36 82 Q66 56 92 74 Q118 92 146 62" fill="none" stroke="#12B5A5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="150" cy="58" r="7" fill="#E03131"/>
    <circle cx="163" cy="66" r="5" fill="#E03131"/>
    <circle cx="140" cy="68" r="4.5" fill="#E03131"/>
    <text x="30" y="52" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#9dc0bf">X marks berries</text>
    <path d="M24 58 l10 10 M34 58 l-10 10" stroke="#F08C00" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
