<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Authentication — proving to the caveman that you are who you say you are">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07171c"/>
      <stop offset="55%" stop-color="#0d2b33"/>
      <stop offset="100%" stop-color="#141d39"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12B5A5"/>
      <stop offset="100%" stop-color="#5C7CFA"/>
    </linearGradient>
    <radialGradient id="fire" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0%" stop-color="#FFD43B"/>
      <stop offset="60%" stop-color="#F08C00"/>
      <stop offset="100%" stop-color="#E03131"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c4a52"/>
      <stop offset="100%" stop-color="#232e35"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="1010" cy="70" r="120" fill="#12B5A5" opacity="0.15" filter="url(#soft)"/>
  <circle cx="860" cy="256" r="100" fill="#5C7CFA" opacity="0.13" filter="url(#soft)"/>
  <rect x="0" y="0" width="6" height="300" rx="3" fill="url(#accent)"/>

  <text x="58" y="88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="1" fill="#f1f8f8">Authentication</text>
  <text x="58" y="128" font-family="Georgia, Cambria, Times New Roman, serif" font-size="22" font-style="italic" fill="#9dc0bf">Proving to the caveman that you are who you say you are</text>
  <rect x="58" y="150" width="74" height="4" rx="2" fill="url(#accent)"/>
  <text x="58" y="194" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="2.5" fill="#6d9291">ISC2 CC · DOMAIN 1 · SECURITY PRINCIPLES</text>

  <g transform="translate(58,216)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="0" y="0" width="186" height="34" rx="8" fill="#12243f" stroke="#5C7CFA" stroke-width="1.5"/>
    <text x="18" y="22" fill="#cdd9fb">Know · Secret grunt</text>
    <rect x="204" y="0" width="176" height="34" rx="8" fill="#1d3a2a" stroke="#2F9E44" stroke-width="1.5"/>
    <text x="222" y="22" fill="#cbe9d4">Have · Shiny rock</text>
    <rect x="398" y="0" width="166" height="34" rx="8" fill="#3a2c12" stroke="#F08C00" stroke-width="1.5"/>
    <text x="416" y="22" fill="#f6dfb8">Are · Your face</text>
  </g>

  <g transform="translate(930,66)">
    <path d="M8 152 Q8 44 96 44 Q184 44 184 152 Z" fill="url(#stone)" stroke="#4d6f6e" stroke-width="2"/>
    <path d="M52 152 Q52 86 96 86 Q140 86 140 152 Z" fill="#07171c"/>
    <path d="M96 150 q-16 -20 -4 -36 q4 14 14 18 q-6 -20 6 -32 q10 26 22 34 q8 12 -6 16 Z" fill="url(#fire)"/>
    <g transform="translate(24,84)">
      <circle cx="0" cy="0" r="13" fill="#6d9291"/>
      <rect x="-12" y="15" width="24" height="46" rx="9" fill="#6d9291"/>
      <rect x="14" y="4" width="9" height="62" rx="4" fill="#8a6b4a" transform="rotate(14 18 34)"/>
      <circle cx="30" cy="4" r="12" fill="#8a6b4a"/>
    </g>
  </g>
</svg>
